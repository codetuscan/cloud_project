name: objstore

x-worker: &worker
  build: .
  command: ["python", "-m", "app.worker.main"]
  restart: unless-stopped
  networks: [internal]
  depends_on:
    controller:
      condition: service_healthy
  environment: &worker-env
    CONTROLLER_URL: http://controller:8080
    WORKER_PORT: "9000"
    DATA_DIR: /data
    HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-5}
    SCRUB_INTERVAL: ${SCRUB_INTERVAL:-1800}
    SCRUB_RATE_MB_S: ${SCRUB_RATE_MB_S:-25}
    CHUNK_CACHE_ENABLED: ${CHUNK_CACHE_ENABLED:-true}
    CHUNK_CACHE_BYTES: ${CHUNK_CACHE_BYTES:-134217728}
    MAX_CONCURRENT_TRANSFERS: ${MAX_CONCURRENT_TRANSFERS:-8}
    TRACING_ENABLED: ${TRACING_ENABLED:-true}
    OTEL_ENDPOINT: http://jaeger:4318
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/healthz')"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-objstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-objstore}
      POSTGRES_DB: ${POSTGRES_DB:-objstore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-objstore} -d ${POSTGRES_DB:-objstore}"]
      interval: 3s
      timeout: 3s
      retries: 20

  controller:
    build: .
    container_name: controller
    command: ["python", "-m", "app.controller.main"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-objstore}:${POSTGRES_PASSWORD:-objstore}@postgres:5432/${POSTGRES_DB:-objstore}
      CONTROLLER_PORT: "8080"
      STAGING_DIR: /staging
      CHUNK_SIZE: ${CHUNK_SIZE:-1048576}
      HEARTBEAT_TIMEOUT: ${HEARTBEAT_TIMEOUT:-15}
      META_CACHE_ENABLED: ${META_CACHE_ENABLED:-true}
      META_CACHE_SIZE: ${META_CACHE_SIZE:-1000}
      META_CACHE_TTL: ${META_CACHE_TTL:-30}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-16}
      ADMISSION_TIMEOUT: ${ADMISSION_TIMEOUT:-30}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-21474836480}
      REPAIR_CONCURRENCY: ${REPAIR_CONCURRENCY:-2}
      REPAIR_SCAN_INTERVAL: ${REPAIR_SCAN_INTERVAL:-10}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-30}
      ORPHAN_GRACE_SECONDS: ${ORPHAN_GRACE_SECONDS:-120}
      UPLOAD_ABANDON_SECONDS: ${UPLOAD_ABANDON_SECONDS:-3600}
      TOMBSTONE_RETENTION_SECONDS: ${TOMBSTONE_RETENTION_SECONDS:-86400}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      OTEL_ENDPOINT: http://jaeger:4318
      READ_HEDGE_ENABLED: ${READ_HEDGE_ENABLED:-true}
      READ_HEDGE_DELAY: ${READ_HEDGE_DELAY:-0}
      READ_AHEAD_CHUNKS: ${READ_AHEAD_CHUNKS:-2}
      REBALANCE_ENABLED: ${REBALANCE_ENABLED:-true}
      REBALANCE_INTERVAL: ${REBALANCE_INTERVAL:-15}
      REBALANCE_TOLERANCE: ${REBALANCE_TOLERANCE:-4}
      REBALANCE_TOLERANCE_PCT: ${REBALANCE_TOLERANCE_PCT:-10}
      REBALANCE_SETTLE_SECONDS: ${REBALANCE_SETTLE_SECONDS:-30}
      REBALANCE_BATCH: ${REBALANCE_BATCH:-16}
      MAX_CONCURRENT_TRANSFERS: ${MAX_CONCURRENT_TRANSFERS:-8}
    volumes:
      - staging:/staging
    ports:
      - "${CONTROLLER_PORT:-8090}:8080"
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker1:
    <<: *worker
    container_name: worker1
    environment: {<<: *worker-env, WORKER_ID: worker1, WORKER_ADDRESS: "http://worker1:9000"}
    volumes: ["worker1_data:/data"]
  worker2:
    <<: *worker
    container_name: worker2
    environment: {<<: *worker-env, WORKER_ID: worker2, WORKER_ADDRESS: "http://worker2:9000"}
    volumes: ["worker2_data:/data"]
  worker3:
    <<: *worker
    container_name: worker3
    environment: {<<: *worker-env, WORKER_ID: worker3, WORKER_ADDRESS: "http://worker3:9000"}
    volumes: ["worker3_data:/data"]
  worker4:
    <<: *worker
    container_name: worker4
    environment: {<<: *worker-env, WORKER_ID: worker4, WORKER_ADDRESS: "http://worker4:9000"}
    volumes: ["worker4_data:/data"]
  # Scale-out demo: not started by `docker compose up`; add it with `docker compose up -d worker5`.
  # It registers like the others and the rebalancer moves existing replicas onto it.
  worker5:
    <<: *worker
    container_name: worker5
    profiles: [scaleout]
    environment: {<<: *worker-env, WORKER_ID: worker5, WORKER_ADDRESS: "http://worker5:9000"}
    volumes: ["worker5_data:/data"]

  # ---- monitoring (optional: the object store does not depend on these) ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [internal]

  # Distributed tracing: the controller and workers send OpenTelemetry spans (OTLP/HTTP, port 4318); UI on 16686.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    restart: unless-stopped
    command: ["--memory.max-traces=20000"]     # in-memory store, bounded; traces are lost on restart
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"
    networks: [internal]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # open the dashboard without logging in (read-only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/objstore.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  staging:
  worker1_data:
  worker2_data:
  worker3_data:
  worker4_data:
  worker5_data:
  promdata:
